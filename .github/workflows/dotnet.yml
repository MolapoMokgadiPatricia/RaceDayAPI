name: RaceDayAPI Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDayAPI.sln

      - name: Build solution
        run: dotnet build RaceDayAPI.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDayAPI.Test/RaceDayAPI.Tests.csproj --configuration Release --no-build